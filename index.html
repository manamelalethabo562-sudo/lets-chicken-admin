<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Let's Chicken - Pro Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #e67e22;
            --primary-dark: #d35400;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --danger: #ff4757;
            --success: #2ecc71;
            --warning: #f1c40f;
            --info: #3498db;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 30px 20px; 
        }

        .container { 
            max-width: 1300px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
            border-bottom: 2px solid #f0f0f0;
        }

        h1 { font-size: 1.8em; font-weight: 700; display: flex; align-items: center; gap: 12px; margin: 0; }
        h1 i { color: var(--primary); }

        /* Filter Pills */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            background: #eee;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }

        /* Stats Section */
        .stats { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { 
            background: white; padding: 20px; border-radius: 16px; flex: 1; 
            min-width: 200px; border: 1px solid #f0f0f0; display: flex; align-items: center; gap: 15px; 
        }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2em; }
        
        /* Status Badges */
        .badge {
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-pending { background: rgba(241, 196, 15, 0.1); color: #d4ac0d; }
        .status-preparing { background: rgba(52, 152, 219, 0.1); color: #2980b9; }
        .status-completed { background: rgba(46, 204, 113, 0.1); color: #27ae60; }

        /* Modern Table */
        .table-container { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 0.8em; color: var(--text-muted); text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }

        /* Advanced Select/Buttons */
        select.status-select {
            padding: 6px 10px;
            border-radius: 50px;
            border: 1px solid #ddd;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .action-btns { display: flex; gap: 8px; }
        .pill-btn {
            border: none;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .btn-delete { background: #fff1f0; color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }

        @media (max-width: 768px) {
            .stats { flex-direction: column; }
            td:before { content: attr(data-label); font-weight: 700; display: block; color: var(--primary); font-size: 0.7em; }
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            tr { border: 1px solid #eee; margin-bottom: 15px; border-radius: 15px; padding: 10px; }
            td { border: none; padding: 8px; }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-chart-line"></i> Let's Chicken Admin</h1>
        <div id="orderCount">Syncing with Cloud...</div>
    </header>

    <div class="stats">
        <div class="stat-card">
            <div class="icon-box" style="background:rgba(230,126,34,0.1); color:var(--primary)"><i class="fas fa-shopping-cart"></i></div>
            <div><small>Today</small><div id="statTotal" class="stat-value" style="font-size:1.5em; font-weight:700">0</div></div>
        </div>
        <div class="stat-card">
            <div class="icon-box" style="background:rgba(46,204,113,0.1); color:var(--success)"><i class="fas fa-money-bill-wave"></i></div>
            <div><small>Revenue</small><div id="statRev" class="stat-value" style="font-size:1.5em; font-weight:700">R0.00</div></div>
        </div>
        <div class="stat-card">
            <div class="icon-box" style="background:rgba(241,196,15,0.1); color:var(--warning)"><i class="fas fa-clock"></i></div>
            <div><small>Pending</small><div id="statPending" class="stat-value" style="font-size:1.5em; font-weight:700">0</div></div>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterOrders('all', this)">All Orders</button>
        <button class="filter-btn" onclick="filterOrders('pending', this)">Pending</button>
        <button class="filter-btn" onclick="filterOrders('preparing', this)">Preparing</button>
        <button class="filter-btn" onclick="filterOrders('completed', this)">Completed</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Order Details</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="orderList">
                </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDUJGDr9lr4RIKypHiefHDeMTnwQ63-2V4",
      authDomain: "let-s-chicken.firebaseapp.com",
      databaseURL: "https://let-s-chicken-default-rtdb.firebaseio.com",
      projectId: "let-s-chicken",
      storageBucket: "let-s-chicken.firebasestorage.app",
      messagingSenderId: "924154280207",
      appId: "1:924154280207:web:79d6d77e2c316329b7267a"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let currentFilter = 'all';

    function filterOrders(status, btn) {
        currentFilter = status;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTable();
    }

    let allOrders = [];

    database.ref('orders').on('value', (snapshot) => {
        allOrders = [];
        snapshot.forEach((child) => {
            allOrders.push({ id: child.key, ...child.val() });
        });
        renderTable();
        updateStats();
    });

    function updateStats() {
        let total = 0;
        let pending = 0;
        let revenue = 0;

        allOrders.forEach(o => {
            total++;
            revenue += parseFloat(o.total || 0);
            if (!o.status || o.status === 'pending') pending++;
        });

        document.getElementById('statTotal').innerText = total;
        document.getElementById('statRev').innerText = 'R' + revenue.toFixed(2);
        document.getElementById('statPending').innerText = pending;
        document.getElementById('orderCount').innerText = `${total} Total Orders`;
    }

    function renderTable() {
        const list = document.getElementById('orderList');
        list.innerHTML = '';

        const filtered = allOrders.filter(o => {
            if (currentFilter === 'all') return true;
            return (o.status || 'pending') === currentFilter;
        }).reverse();

        filtered.forEach(order => {
            const status = order.status || 'pending';
            const cleanProduct = order.product.replace(/(\s*-\s*)?R\s?\d+(\.\d{2})?/, '').trim();
            
            const row = `
                <tr>
                    <td data-label="Customer">
                        <div style="font-weight:600">${order.name}</div>
                        <div style="font-size:0.8em; color:#999">${new Date(order.timestamp).toLocaleString()}</div>
                    </td>
                    <td data-label="Order">
                        <div><strong>${order.quantity}x</strong> ${cleanProduct}</div>
                        <div style="font-size:0.85em; color:#777">Note: ${order.notes || 'No notes'}</div>
                    </td>
                    <td data-label="Total" style="font-weight:700">R${parseFloat(order.total).toFixed(2)}</td>
                    <td data-label="Status">
                        <select class="status-select status-${status}" onchange="updateStatus('${order.id}', this.value)">
                            <option value="pending" ${status === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="preparing" ${status === 'preparing' ? 'selected' : ''}>👨‍🍳 Preparing</option>
                            <option value="completed" ${status === 'completed' ? 'selected' : ''}>✅ Completed</option>
                        </select>
                    </td>
                    <td data-label="Actions">
                        <div class="action-btns">
                            <button class="pill-btn btn-delete" onclick="deleteOrder('${order.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                            <a href="tel:${order.phone}" class="pill-btn" style="background:#e3f2fd; color:#1976d2; text-decoration:none;">
                                <i class="fas fa-phone"></i>
                            </a>
                        </div>
                    </td>
                </tr>
            `;
            list.innerHTML += row;
        });
    }

    function updateStatus(id, newStatus) {
        database.ref('orders/' + id).update({ status: newStatus });
    }

    function deleteOrder(id) {
        if (confirm("Permanently remove this order?")) {
            database.ref('orders/' + id).remove();
        }
    }
</script>

</body>
