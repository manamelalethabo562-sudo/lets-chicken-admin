<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Chicken - Admin Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #e67e22;
            --primary-dark: #d35400;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --danger: #ff4757;
            --danger-hover: #ff6b81;
            --success: #2ecc71;
            --warning: #f39c12;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 30px 20px; 
        }

        .container { 
            max-width: 1200px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
            border-bottom: 2px solid #f0f0f0;
        }

        h1 { 
            color: var(--text-main); 
            margin: 0; 
            font-size: 2em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 i {
            color: var(--primary);
        }

        #orderCount {
            background: rgba(230, 126, 34, 0.1);
            color: var(--primary-dark);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .stats { 
            display: flex; 
            gap: 25px; 
            margin-bottom: 35px; 
            flex-wrap: wrap;
        }

        .stat-card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            flex: 1; 
            min-width: 240px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }

        .icon-orders { background: rgba(52, 152, 219, 0.1); color: #3498db; }
        .icon-revenue { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-card small {
            color: var(--text-muted);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white;
        }

        th { 
            background-color: #f8f9fa; 
            color: var(--text-muted); 
            text-align: left; 
            padding: 16px; 
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #eaedf1;
        }

        td { 
            padding: 16px; 
            border-bottom: 1px solid #f0f0f0; 
            font-size: 0.95em; 
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover { 
            background-color: #fafbfc; 
        }
        
        a[href^="tel:"] {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        a[href^="tel:"]:hover {
            text-decoration: underline;
        }

        /* Status Dropdown Styling */
        .status-select {
            padding: 6px 12px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .status-select.processing {
            background-color: #fff3e0;
            color: var(--warning);
            border-color: var(--warning);
        }

        .status-select.completed {
            background-color: #e8f8f5;
            color: var(--success);
            border-color: var(--success);
        }

        /* Pill shaped buttons */
        .delete-btn { 
            background: var(--danger); 
            color: white; 
            border: none; 
            padding: 8px 18px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.9em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.2);
        }

        .delete-btn:hover {
            background: var(--danger-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.3);
        }

        .notes { 
            font-style: italic; 
            color: var(--text-muted); 
            font-size: 0.9em; 
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.8);
            transition: all 0.3s ease;
            box-shadow: 0 15px 50px rgba(0,0,0,0.1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .success-icon {
            font-size: 4em;
            color: var(--success);
            margin-bottom: 20px;
        }

        .modal-content h2 {
            margin: 0 0 10px;
            color: var(--text-main);
            font-weight: 700;
        }

        .modal-content p {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.95em;
        }

        .close-modal-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .close-modal-btn:hover {
            background: #27ae60;
            transform: translateY(-2px);
        }

        /* Responsive Table */
        @media (max-width: 768px) {
            .container { padding: 20px; }
            header { flex-direction: column; gap: 15px; align-items: flex-start; }
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            tr { 
                margin-bottom: 15px; 
                border: 1px solid #f0f0f0; 
                padding: 15px; 
                border-radius: 12px; 
                background: white;
            }
            td { 
                border: none; 
                padding: 10px 0 10px 45%; 
                position: relative; 
            }
            td:before { 
                position: absolute; 
                left: 0; 
                font-weight: 600; 
                content: attr(data-label); 
                color: var(--text-muted);
                text-transform: uppercase;
                font-size: 0.85em;
            }
            td:last-child {
                padding-bottom: 0;
                border-top: 1px dashed #eee;
                margin-top: 10px;
                padding-left: 0;
                text-align: right;
            }
            td:last-child:before { display: none; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1><i class="fas fa-drumstick-bite"></i> Let's Chicken</h1>
        <div id="orderCount"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    </header>

    <div class="stats">
        <div class="stat-card">
            <div class="icon-box icon-orders"><i class="fas fa-shopping-bag"></i></div>
            <div class="stat-info">
                <small>Total Orders</small>
                <div id="totalOrders" class="stat-value">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="icon-box icon-revenue"><i class="fas fa-wallet"></i></div>
            <div class="stat-info">
                <small>Total Revenue</small>
                <div id="totalRevenue" class="stat-value">R0.00</div>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Order</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="orderList"></tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="successModal">
    <div class="modal-content">
        <i class="fas fa-check-circle success-icon"></i>
        <h2>Order Completed!</h2>
        <p>The order status has been successfully updated.</p>
        <button class="close-modal-btn" onclick="closeModal()">Awesome!</button>
    </div>
</div>

<script>
    // === YOUR FIREBASE CONFIG ===
    const firebaseConfig = {
      apiKey: "AIzaSyDUJGDr9lr4RIKypHiefHDeMTnwQ63-2V4",
      authDomain: "let-s-chicken.firebaseapp.com",
      databaseURL: "https://let-s-chicken-default-rtdb.firebaseio.com",
      projectId: "let-s-chicken",
      storageBucket: "let-s-chicken.firebasestorage.app",
      messagingSenderId: "924154280207",
      appId: "1:924154280207:web:79d6d77e2c316329b7267a",
      measurementId: "G-YXXM4ZJ9BQ"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Real-time listener
    const ordersRef = database.ref('orders');
    
    ordersRef.on('value', (snapshot) => {
        const orderList = document.getElementById('orderList');
        orderList.innerHTML = '';

        let count = 0;
        let revenue = 0;

        snapshot.forEach((childSnapshot) => {
            const order = childSnapshot.val();
            const key = childSnapshot.key;

            count++;
            revenue += parseFloat(order.total) || 0;

            const date = new Date(order.timestamp).toLocaleString('en-ZA', { 
                day: '2-digit', month: 'short', year: 'numeric', 
                hour: '2-digit', minute:'2-digit' 
            });
            
            // Clean the product name
            const cleanProduct = order.product.replace(/(\s*-\s*)?R\s?\d+(\.\d{2})?/, '').trim();
            
            // Fetch status, defaulting to 'processing' if it doesn't exist yet
            const currentStatus = order.status || 'processing';

            const row = `
                <tr>
                    <td data-label="Date">${date}</td>
                    <td data-label="Customer"><strong>${order.name}</strong></td>
                    <td data-label="Phone"><a href="tel:${order.phone}"><i class="fas fa-phone-alt"></i> ${order.phone}</a></td>
                    <td data-label="Order">${cleanProduct}</td>
                    <td data-label="Qty"><strong>${order.quantity}x</strong></td>
                    <td data-label="Total" style="color: #2ecc71; font-weight: 700;">R${parseFloat(order.total).toFixed(2)}</td>
                    <td data-label="Status">
                        <select class="status-select ${currentStatus}" onchange="updateOrderStatus('${key}', this.value)">
                            <option value="processing" ${currentStatus === 'processing' ? 'selected' : ''}>Processing</option>
                            <option value="completed" ${currentStatus === 'completed' ? 'selected' : ''}>Completed</option>
                        </select>
                    </td>
                    <td data-label="Notes" class="notes">${order.notes || '—'}</td>
                    <td data-label="Actions">
                        <button class="delete-btn" onclick="deleteOrder('${key}')">
                            <i class="fas fa-trash"></i> Remove
                        </button>
                    </td>
                </tr>
            `;
            orderList.insertAdjacentHTML('afterbegin', row); 
        });

        // Update stats
        document.getElementById('totalOrders').textContent = count;
        document.getElementById('totalRevenue').textContent = 'R' + revenue.toFixed(2);
        document.getElementById('orderCount').innerHTML = `<i class="fas fa-check-circle"></i> ${count} Orders Found`;
    });

    // Update Status function with Promise handling for Modal
    function updateOrderStatus(key, newStatus) {
        database.ref('orders/' + key).update({
            status: newStatus
        }).then(() => {
            // Trigger the success modal ONLY if marked as completed
            if (newStatus === 'completed') {
                showModal();
            }
        }).catch((error) => {
            console.error("Error updating order status:", error);
            alert("Failed to update status. Please try again.");
        });
    }

    // Modal Control Functions
    function showModal() {
        document.getElementById('successModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('successModal').classList.remove('active');
    }

    // Delete function
    function deleteOrder(key) {
        if (confirm("Are you sure you want to delete this order permanently?")) {
            database.ref('orders/' + key).remove();
        }
    }
</script>
</body>
</html>
